name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: markdown-rag ingest --input examples --output /tmp/markdown-rag-output
      - run: test -s /tmp/markdown-rag-output/chunks.jsonl
      - run: test -s /tmp/markdown-rag-output/manifest.json
